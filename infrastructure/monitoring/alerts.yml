groups:
  - name: workermate-availability
    rules:
      - alert: WorkermateApiDown
        expr: up{job="workermate-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Workermate API indisponible
          description: Prometheus ne peut plus joindre l'API Workermate.

      - alert: WorkermateApiHighErrorRate
        expr: sum(rate(workermate_http_requests_total{job="workermate-api",status_code=~"5.."}[5m])) / clamp_min(sum(rate(workermate_http_requests_total{job="workermate-api"}[5m])), 1) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Taux d'erreur API élevé
          description: Plus de 5% des requêtes API retournent une erreur 5xx depuis 5 minutes.

      - alert: WorkermateApiHighLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(workermate_http_request_duration_seconds_bucket{job="workermate-api"}[5m]))) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Latence API élevée
          description: Le percentile 95 de la latence API dépasse 2 secondes.

      - alert: WorkermateHealthNotReady
        expr: probe_success{job="workermate-api-health"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Readiness API en échec
          description: Le service API ne passe plus son contrôle de readiness.

  - name: infrastructure
    rules:
      - alert: HostHighCpu
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: CPU machine élevé
          description: Le CPU dépasse 85% depuis 10 minutes.

      - alert: HostHighMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Mémoire machine élevée
          description: La mémoire utilisée dépasse 90% depuis 10 minutes.

      - alert: HostDiskAlmostFull
        expr: 100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Espace disque faible
          description: Un système de fichiers dépasse 85% d'utilisation.

      - alert: ContainerRestarting
        expr: increase(container_restart_count[15m]) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Conteneur instable
          description: Un conteneur a redémarré plusieurs fois récemment.

  - name: databases
    rules:
      - alert: PostgresExporterDown
        expr: up{job="postgres"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Métriques PostgreSQL indisponibles
          description: PostgreSQL Exporter ne répond plus.

      - alert: PostgresConnectionsNearLimit
        expr: pg_stat_database_numbackends / pg_settings_max_connections > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: PostgreSQL proche de la limite de connexions
          description: Plus de 80% des connexions PostgreSQL sont utilisées.

      - alert: RedisExporterDown
        expr: up{job="redis"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Métriques Redis indisponibles
          description: Redis Exporter ne répond plus.

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.8 and redis_memory_max_bytes > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Mémoire Redis élevée
          description: Redis utilise plus de 80% de sa mémoire maximale.
